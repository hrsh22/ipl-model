<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IPL Observer Terminal</title>
    <link rel="stylesheet" href="/observer/assets/observer-dashboard.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar panel">
        <div>
          <p class="eyebrow">IPL trader observer</p>
          <h1>Market Engine Terminal</h1>
        </div>
        <div class="topbar-controls">
          <button id="refresh-now" type="button">Refresh</button>
        </div>
      </header>

      <section class="status-grid">
        <article class="panel hero-card">
          <p class="eyebrow">System</p>
          <div class="hero-metrics" id="hero-metrics"></div>
        </article>
        <article class="panel hero-card">
          <p class="eyebrow">Engine</p>
          <div class="hero-metrics" id="engine-metrics"></div>
        </article>
      </section>

      <section class="layout-grid">
        <article class="panel live-panel">
          <div class="panel-header">
            <h2>Live Fixtures</h2>
            <span class="pill" id="live-fixture-count">0</span>
          </div>
          <div id="live-fixtures" class="stacked-list"></div>
        </article>

        <article class="panel opportunity-panel">
          <div class="panel-header">
            <h2>Actionable Opportunities</h2>
            <span class="pill success" id="actionable-count">0</span>
          </div>
          <div id="opportunities" class="stacked-list"></div>
        </article>

        <article class="panel diagnostics-panel">
          <div class="panel-header">
            <h2>Attention / Degradation</h2>
            <span class="pill warning" id="attention-count">0</span>
          </div>
          <div id="diagnostics" class="stacked-list"></div>
        </article>

        <article class="panel tape-panel">
          <div class="panel-header">
            <h2>Live Tape</h2>
            <span class="pill" id="history-count">0</span>
          </div>
          <div id="history" class="stacked-list compact"></div>
        </article>
      </section>
    </div>

    <template id="empty-state-template">
      <div class="empty-state">No data yet.</div>
    </template>

    <script type="module" src="/observer/assets/observer-dashboard.js"></script>
  </body>
</html>
